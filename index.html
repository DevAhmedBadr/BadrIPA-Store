<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trove">
<meta name="theme-color" content="#000">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<title>Trove</title>
<style>
:root{--bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--bd:#3a3a3c;--tx:#fff;--mu:#8e8e93;--ac:#0a84ff;--gr:#30d158;--re:#ff453a;--or:#ff9f0a;--pu:#bf5af2;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;box-sizing:border-box;margin:0;padding:0}
input{user-select:text;-webkit-user-select:text}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;overscroll-behavior:none;height:100%;overflow:hidden}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .9s cubic-bezier(.4,0,.2,1)}
#splash.hide{opacity:0;pointer-events:none}
.sp-icon{width:90px;height:90px;border-radius:22px;background:#141414;border:1px solid #242424;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(16px) scale(.9);animation:spIn .7s cubic-bezier(.34,1.4,.64,1) .1s forwards}
.sp-icon svg{width:46px;height:46px}
.sp-name{font-size:28px;font-weight:700;letter-spacing:-.5px;opacity:0;transform:translateY(10px);animation:spFade .55s cubic-bezier(.4,0,.2,1) .32s forwards}
.sp-sub{font-size:13px;color:var(--mu);opacity:0;transform:translateY(8px);animation:spFade .5s cubic-bezier(.4,0,.2,1) .46s forwards}
.sp-by{font-size:10px;color:#3a3a3c;letter-spacing:.08em;text-transform:uppercase;opacity:0;animation:spFade .5s ease .65s forwards;margin-top:-6px}
.sp-ring{width:22px;height:22px;border:1.5px solid #242424;border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite,spFade .4s ease .72s both}
@keyframes spIn{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spFade{to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* APP SHELL */
#app{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .5s cubic-bezier(.4,0,.2,1)}

/* NAV */
.nav{flex-shrink:0;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);padding-top:var(--st)}
.nav-inner{position:relative;display:flex;align-items:center;justify-content:center;padding:10px 16px;height:44px}
.nav-title{font-size:17px;font-weight:600}
.nav-right{position:absolute;right:16px;font-size:12px;color:var(--mu);transition:opacity .3s ease}

/* TABS */
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--bd);flex-shrink:0}
.tab{flex:1;padding:10px 0 8px;text-align:center;font-size:11px;font-weight:500;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s ease,border-color .2s ease}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}

/* SEARCH */
.search-area{flex-shrink:0;padding:8px 16px 6px;background:var(--bg)}
.search-box{background:var(--s1);border-radius:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;transition:background .2s ease,box-shadow .25s cubic-bezier(.4,0,.2,1)}
.search-box:focus-within{background:var(--s2);box-shadow:0 0 0 1.5px rgba(10,132,255,.4)}
.search-box svg{color:var(--mu);flex-shrink:0;transition:color .2s ease}
.search-box:focus-within svg{color:var(--ac)}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:16px;font-family:inherit}
.search-box input::placeholder{color:var(--mu)}
.clr{background:#636366;border:none;border-radius:50%;width:18px;height:18px;color:#fff;display:none;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;padding:0;line-height:0}
.clr.on{display:flex}

/* LIGHTBOX */
#lightbox{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
#lb-bg{position:absolute;inset:0;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px)}
#lb-img{position:relative;z-index:1;max-width:100%;max-height:80vh;border-radius:14px;object-fit:contain}
#lb-close{position:relative;z-index:2;background:rgba(44,44,46,.95);border:.5px solid rgba(80,80,80,.6);color:#fff;font-size:15px;font-weight:600;font-family:inherit;padding:10px 32px;border-radius:20px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#lb-close:active{opacity:.7}

/* CHIPS */
.chips{display:flex;gap:7px;padding:6px 16px 8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:30px;padding:0 13px;border-radius:15px;font-size:13px;font-weight:500;border:1px solid var(--bd);color:var(--mu);background:var(--s1);white-space:nowrap;display:flex;align-items:center;cursor:pointer;transition:background .2s cubic-bezier(.4,0,.2,1),color .2s ease,border-color .2s ease,transform .15s cubic-bezier(.34,1.6,.64,1)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---- REPOS VIEW ---- */
.repo-card{background:var(--s1);border-radius:14px;padding:14px 14px;margin:0 16px 8px;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.5,.64,1),opacity .15s ease;opacity:0;transform:translateY(12px);animation:rowIn .4s cubic-bezier(.34,1.2,.64,1) forwards;border:.5px solid rgba(58,58,60,.5)}
.repo-card:active{transform:scale(.97);opacity:.7}
.rc-top{display:flex;align-items:center;gap:12px}
.rc-icon{width:44px;height:44px;flex-shrink:0;border-radius:10px;background:var(--s2);display:flex;align-items:center;justify-content:center;border:.5px solid rgba(58,58,60,.5);overflow:hidden}
.rc-icon img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.rc-info{flex:1;min-width:0}
.rc-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.rc-cat{font-size:11px;font-weight:500;border-radius:5px;padding:2px 7px}
.rc-apps{font-size:12px;color:var(--mu)}
.bdg{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.bdg-v{background:rgba(48,209,88,.15);color:var(--gr)}
.bdg-o{background:rgba(10,132,255,.15);color:var(--ac)}
.rc-desc{font-size:13px;color:var(--mu);margin-top:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-chev{color:var(--bd);flex-shrink:0}
.rc-progress{margin-top:10px;height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.rc-progress-fill{height:100%;background:var(--ac);border-radius:2px;transition:width .3s ease}
.rc-status{font-size:11px;color:var(--mu);margin-top:4px}

/* ---- APPS VIEW ---- */
.app-row{display:flex;align-items:center;gap:14px;padding:11px 16px 11px 16px;border-bottom:.5px solid rgba(58,58,60,.6);cursor:pointer;transition:transform .18s cubic-bezier(.34,1.4,.64,1),opacity .12s ease;background:var(--bg);opacity:0;transform:translateY(10px);animation:rowIn .38s cubic-bezier(.34,1.2,.64,1) forwards}
.app-row:active{transform:scale(.98);opacity:.65}
.app-row:first-child{border-top:none}
@keyframes rowIn{to{opacity:1;transform:translateY(0)}}
.ai{width:58px;height:58px;flex-shrink:0;border-radius:13px;background:var(--s1);overflow:hidden;border:.5px solid rgba(58,58,60,.5)}
.ai img{width:100%;height:100%;object-fit:cover;display:block}
.ai-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px}
.ad{flex:1;min-width:0}
.ad-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ad-sub{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;line-height:1.3}
.ad-dev{font-size:11px;color:#48484a;margin-top:2px;letter-spacing:.01em}
.get-btn{flex-shrink:0;background:rgba(10,132,255,.15);border:none;color:var(--ac);font-size:13px;font-weight:700;font-family:inherit;padding:6px 16px;border-radius:16px;cursor:pointer;white-space:nowrap;letter-spacing:.01em;transition:transform .16s cubic-bezier(.34,1.6,.64,1),opacity .12s ease}
.get-btn:active{transform:scale(.88);opacity:.7}

/* section header */
.sec-hdr{font-size:11px;font-weight:700;color:var(--mu);padding:18px 16px 6px;background:var(--bg);text-transform:uppercase;letter-spacing:.1em;opacity:0;animation:spFade .3s ease .05s forwards}

/* ---- APP DETAIL SHEET ---- */
.sheet{position:fixed;inset:0;z-index:500;background:var(--bg);transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding-bottom:var(--sb)}
.sheet.open{transform:translateY(0)}
.sh-nav{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 10px) 16px 10px;border-bottom:1px solid var(--bd);background:var(--s1);flex-shrink:0}
.sh-title{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.sh-close{width:30px;height:30px;border-radius:50%;background:var(--s2);border:none;color:var(--mu);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;line-height:1;padding:0;transition:background .2s ease,transform .15s cubic-bezier(.34,1.6,.64,1)}
.sh-close:active{transform:scale(.88);background:var(--bd)}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* app detail content */
.app-hero{padding:20px 16px 16px;display:flex;gap:16px;align-items:flex-start;opacity:0;transform:translateY(16px);animation:rowIn .45s cubic-bezier(.34,1.2,.64,1) .05s forwards}
.app-big-icon{width:80px;height:80px;flex-shrink:0;border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:var(--s1);transform:scale(.88);animation:iconPop .5s cubic-bezier(.34,1.56,.64,1) .08s forwards}
@keyframes iconPop{to{transform:scale(1)}}
.app-big-icon img{width:100%;height:100%;object-fit:cover}
.app-hero-info{flex:1;min-width:0}
.app-big-name{font-size:22px;font-weight:700;line-height:1.15}
.app-big-sub{font-size:14px;color:var(--mu);margin-top:3px}
.app-big-dev{font-size:13px;color:var(--mu);margin-top:2px}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:var(--ac);border:none;color:#fff;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;margin:0 0 10px;transition:transform .18s cubic-bezier(.34,1.5,.64,1),opacity .15s ease,background .25s ease}
.dl-btn:active{transform:scale(.96);opacity:.88}
.dl-btn.ok{background:var(--gr)}
.cp-btn{width:100%;padding:13px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);color:var(--tx);font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;margin-bottom:20px;transition:transform .15s cubic-bezier(.34,1.5,.64,1),opacity .12s ease}
.cp-btn:active{transform:scale(.97);opacity:.7}
.px{padding:0 16px}

/* screenshots */
.screenshots{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screenshots::-webkit-scrollbar{display:none}
.ss-img{height:200px;border-radius:12px;flex-shrink:0;object-fit:cover;border:1px solid var(--bd);background:var(--s2);transition:transform .2s cubic-bezier(.34,1.4,.64,1);will-change:transform}
.ss-img:active{transform:scale(.97)}

/* versions */
.ver-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--bd);cursor:pointer;transition:opacity .12s ease}
.ver-row:last-child{border-bottom:none}
.ver-row:active{opacity:.55}
.ver-num{font-size:15px;font-weight:500}
.ver-date{font-size:13px;color:var(--mu);margin-top:1px}
.ver-dl{background:var(--s2);border:none;color:var(--ac);font-size:13px;font-weight:600;font-family:inherit;padding:6px 14px;border-radius:12px;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.6,.64,1),opacity .12s ease}
.ver-dl:active{transform:scale(.9);opacity:.7}

/* info group */
.ig{background:var(--s1);border-radius:14px;overflow:hidden;margin-bottom:12px}
.ir{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--bd);transition:opacity .1s}
.ir:last-child{border-bottom:none}
.il{font-size:15px}
.iv{font-size:15px;color:var(--mu);text-align:right;max-width:60%;word-break:break-all}

/* get-btn defined above in apps view */

/* desc */
.app-desc{font-size:15px;color:var(--mu);line-height:1.55;background:var(--s1);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.app-desc.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.read-more{color:var(--ac);font-size:14px;font-weight:500;background:none;border:none;font-family:inherit;padding:0 16px 12px;cursor:pointer}

/* loading states */
.loading-grid{display:flex;flex-direction:column;gap:10px;padding:16px}
.skel{background:var(--s1);border-radius:14px;height:72px;margin:0 16px 10px;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:.2}}
.empty-state{text-align:center;padding:60px 20px;color:var(--mu);font-size:15px;opacity:0;animation:spFade .4s ease .1s forwards}
.err-state{text-align:center;padding:40px 20px;color:var(--re);font-size:14px;line-height:1.5}

/* toast */
.toast{position:fixed;bottom:calc(var(--sb) + 22px);left:50%;transform:translateX(-50%) translateY(80px);z-index:9000;background:rgba(44,44,46,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:14px;font-weight:500;padding:11px 20px;border-radius:14px;white-space:nowrap;transition:transform .36s cubic-bezier(.34,1.4,.64,1),opacity .3s ease;pointer-events:none;opacity:0}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="splash">
  <div class="sp-icon">
    <svg viewBox="0 0 46 46" fill="none">
      <rect x="5" y="9" width="36" height="8" rx="4" fill="#fff"/>
      <rect x="5" y="21" width="26" height="8" rx="4" fill="#fff" opacity=".5"/>
      <rect x="5" y="33" width="16" height="8" rx="4" fill="#fff" opacity=".22"/>
    </svg>
  </div>
  <div class="sp-name">Trove</div>
  <div class="sp-sub">iOS App Repository</div>
  <div class="sp-by">by Strykey</div>
  <div class="sp-ring"></div>
</div>

<div id="app">
  <div class="nav">
    <div class="nav-inner">
      <div class="nav-title" style="display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1">
        <span style="font-size:17px;font-weight:600">Trove</span>
        <span style="font-size:9px;font-weight:400;color:var(--mu);letter-spacing:.1em;text-transform:uppercase">by Strykey</span>
      </div>
      <div class="nav-right" id="nav-rc"></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" onclick="switchTab('apps',this)">Apps</div>
    <div class="tab" onclick="switchTab('repos',this)">Sources</div>
  </div>

  <div class="search-area">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="si" type="text" placeholder="Search apps, sources..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clr" id="cb" onclick="clrS()"><svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="7" y2="7"/><line x1="7" y1="1" x2="1" y2="7"/></svg></button>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="scroll" id="scroll-area">
    <div style="height:4px"></div>
    <div id="main-content"></div>
    <div style="height:32px"></div>
  </div>
</div>

<!-- APP DETAIL SHEET -->
<div class="sheet" id="sheet" style="display:none">
  <div class="sh-nav">
    <button class="sh-close" onclick="closeSheet()"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg></button>
    <div class="sh-title" id="sh-title"></div>
    <div style="width:30px"></div>
  </div>
  <div class="sh-body" id="sh-body"></div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <div id="lb-bg"></div>
  <img id="lb-img" src="" alt="">
  <button id="lb-close" onclick="event.stopPropagation();closeLightbox()">Close</button>
</div>

<div class="toast" id="toast">Copied</div>

<script>
const PROXY = 'https://corsproxy.io/?';
const REPOS_URL = 'https://www.jsonkeeper.com/b/ZU16J';
const SA = window.navigator.standalone === true;

// Stylish SVG fallback icons for apps (grid of dots pattern)
const APP_FALLBACK_SVG = `<svg viewBox="0 0 58 58" fill="none" xmlns="http://www.w3.org/2000/svg" width="58" height="58">
  <rect width="58" height="58" rx="13" fill="#1c1c1e"/>
  <rect x="13" y="13" width="9" height="9" rx="2.5" fill="#2c2c2e"/>
  <rect x="25" y="13" width="9" height="9" rx="2.5" fill="#3a3a3c"/>
  <rect x="37" y="13" width="9" height="9" rx="2.5" fill="#2c2c2e"/>
  <rect x="13" y="25" width="9" height="9" rx="2.5" fill="#3a3a3c"/>
  <rect x="25" y="25" width="9" height="9" rx="2.5" fill="#48484a"/>
  <rect x="37" y="25" width="9" height="9" rx="2.5" fill="#3a3a3c"/>
  <rect x="13" y="37" width="9" height="9" rx="2.5" fill="#2c2c2e"/>
  <rect x="25" y="37" width="9" height="9" rx="2.5" fill="#3a3a3c"/>
  <rect x="37" y="37" width="9" height="9" rx="2.5" fill="#2c2c2e"/>
</svg>`;

const REPO_FALLBACK_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" stroke="#48484a" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="3.27 6.96 12 12.01 20.73 6.96" stroke="#48484a" stroke-width="1.5"/>
  <line x1="12" y1="22.08" x2="12" y2="12" stroke="#48484a" stroke-width="1.5"/>
</svg>`;

function fallbackIcon(app) {
  return `<div class="ai-placeholder" style="display:flex;background:#1c1c1e;padding:0">${APP_FALLBACK_SVG}</div>`;
}

let REPOS_META = [];
let ALL_APPS = [];    // [{app, repoName, repoUrl, repoMeta}]
let REPOS_DATA = [];  // [{meta, apps:[]}]
let activeTab = 'apps';
let activeCategory = 'all';
let searchQuery = '';
let descExpanded = false;

const CC = {Official:'#0a84ff','Mega Library':'#ff9f0a',Emulators:'#30d158','Emulators & Jailbreak':'#30d158','Tweaked Apps':'#ffd60a',Jailbreak:'#ff453a',Utilities:'#8e8e93',Streaming:'#bf5af2',Games:'#30d158'};

// ---- FETCH HELPERS ----
async function fetchJSON(url) {
  // Try direct first, then proxy
  try {
    const r = await fetch(url, {signal: AbortSignal.timeout(8000)});
    if (r.ok) return await r.json();
  } catch(e) {}
  try {
    const r = await fetch(PROXY + encodeURIComponent(url), {signal: AbortSignal.timeout(10000)});
    if (r.ok) return await r.json();
  } catch(e) {}
  return null;
}

// ---- INIT ----
async function init() {
  // Load repos meta list
  const meta = await fetchJSON(REPOS_URL);
  if (!meta) { showError('Failed to load sources list.'); return; }
  REPOS_META = meta.repos;

  buildChips(meta.categories);
  document.getElementById('nav-rc').textContent = REPOS_META.length + ' sources';

  if (SA) {
    setTimeout(() => {
      document.getElementById('splash').classList.add('hide');
      setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('app').style.opacity = '1';
      }, 900);
    }, 2800);
  } else {
    setTimeout(() => {
      document.getElementById('splash').classList.add('hide');
      setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('app').style.opacity = '1';
      }, 800);
    }, 1400);
  }

  renderSkeleton();
  await loadAllRepos();
}

async function loadAllRepos() {
  const content = document.getElementById('main-content');
  let loaded = 0;
  const total = REPOS_META.length;

  // Load all repos concurrently in batches of 6
  const batchSize = 6;
  for (let i = 0; i < REPOS_META.length; i += batchSize) {
    const batch = REPOS_META.slice(i, i + batchSize);
    await Promise.all(batch.map(async (repoMeta) => {
      const data = await fetchJSON(repoMeta.url);
      loaded++;
      if (data && data.apps) {
        const apps = data.apps.map(a => ({...a, _repoName: repoMeta.name, _repoUrl: repoMeta.url, _repoMeta: repoMeta}));
        ALL_APPS.push(...apps);
        REPOS_DATA.push({meta: repoMeta, apps: data.apps, raw: data});
      } else {
        REPOS_DATA.push({meta: repoMeta, apps: [], raw: null, failed: !data});
      }
      // Update progress feedback
      document.getElementById('nav-rc').textContent = `${loaded}/${total} loaded`;
    }));
    render(); // re-render after each batch
  }
  document.getElementById('nav-rc').textContent = ALL_APPS.length + ' apps';
}

// ---- RENDER ----
function render() {
  if (activeTab === 'apps') renderApps();
  else renderRepos();
}

function filteredApps() {
  let list = [...ALL_APPS];
  if (activeCategory !== 'all') {
    // filter by matching repo category
    list = list.filter(a => a._repoMeta && a._repoMeta.category === activeCategory);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(a =>
      (a.name||'').toLowerCase().includes(q) ||
      (a.subtitle||'').toLowerCase().includes(q) ||
      (a.developerName||'').toLowerCase().includes(q) ||
      (a.localizedDescription||'').toLowerCase().includes(q) ||
      (a.bundleIdentifier||'').toLowerCase().includes(q) ||
      (a._repoName||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function renderApps() {
  const list = filteredApps();
  const el = document.getElementById('main-content');

  if (!list.length && ALL_APPS.length === 0) {
    renderSkeleton(); return;
  }
  if (!list.length) {
    el.innerHTML = '<div class="empty-state">No apps found</div>'; return;
  }

  // Group by repo source for display
  if (searchQuery || activeCategory !== 'all') {
    // flat list when searching
    el.innerHTML = list.map((a,i) => appRowHTML(a,i)).join('');
  } else {
    // grouped by repo
    let html = '';
    REPOS_DATA.filter(r => r.apps.length > 0).forEach(r => {
      html += `<div class="sec-hdr">${r.meta.name}</div>`;
      r.apps.slice(0, 30).forEach((a, i) => {
        html += appRowHTML({...a, _repoName: r.meta.name, _repoUrl: r.meta.url, _repoMeta: r.meta}, i);
      });
    });
    el.innerHTML = html || '<div class="empty-state">Loading apps...</div>';
  }
}

function appRowHTML(a, idx) {
  const id = storeApp(a, a._repoMeta || {url: a._repoUrl||'', name: a._repoName||'', id:-1});
  const icon = a.iconURL
    ? `<img src="${a.iconURL}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy">${fallbackIcon(a)}`
    : fallbackIcon(a);
  const delay = Math.min((idx||0) * 35, 400);
  const dl = getBestDownloadURL(a);
  return `<div class="app-row" style="animation-delay:${delay}ms" onclick="openStoredApp(${id})">
    <div class="ai">${icon}</div>
    <div class="ad">
      <div class="ad-name">${esc(a.name||'Unknown')}</div>
      <div class="ad-sub">${esc(a.subtitle || (a.localizedDescription ? a.localizedDescription.slice(0,60) : ''))}</div>
      <div class="ad-dev">${esc(a.developerName||a._repoName||'')}</div>
    </div>
    ${dl ? `<button class="get-btn" onclick="event.stopPropagation();dlApp('${esc(dl)}','${esc(a.name||'')}')">GET</button>` : `<span style="flex-shrink:0;font-size:12px;color:var(--mu)">N/A</span>`}
  </div>`;
}

function renderRepos() {
  const el = document.getElementById('main-content');
  const q = searchQuery.toLowerCase();
  let list = REPOS_META;
  if (q) list = list.filter(r => r.name.toLowerCase().includes(q) || r.category.toLowerCase().includes(q) || (r.tags||[]).some(t=>t.includes(q)));
  if (activeCategory !== 'all') list = list.filter(r => r.category === activeCategory);

  if (!list.length) { el.innerHTML = '<div class="empty-state">No sources found</div>'; return; }

  el.innerHTML = list.map((r, idx) => {
    const rd = REPOS_DATA.find(x => x.meta.id === r.id);
    const appCount = rd ? rd.apps.length : null;
    const failed = rd && rd.failed;
    const loading = !rd;
    const cc = CC[r.category]||'#8e8e93';
    const bv = r.certified ? `<span class="bdg bdg-v">Verified</span>` : '';
    const bo = r.official ? `<span class="bdg bdg-o">Official</span>` : '';
    const status = loading ? 'Loading...' : failed ? 'Failed to load' : `${appCount} apps loaded`;
    const delay = Math.min(idx * 40, 500);
    return `<div class="repo-card" style="animation-delay:${delay}ms" onclick="openRepoDetail(${r.id})">
      <div class="rc-top">
        <div class="rc-icon" style="color:${cc};background:var(--s2)">${REPO_FALLBACK_SVG}</div>
        <div class="rc-info">
          <div class="rc-name">${r.name}</div>
          <div class="rc-meta">
            <span class="rc-cat" style="color:${cc};background:${cc}1a">${r.category}</span>
            ${bv}${bo}
            <span class="rc-apps">${status}</span>
          </div>
        </div>
        <svg class="rc-chev" width="7" height="13" viewBox="0 0 7 13" fill="none"><path d="M1 1l5 5.5L1 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="rc-desc">${r.description}</div>
    </div>`;
  }).join('');
}

function renderSkeleton() {
  document.getElementById('main-content').innerHTML =
    Array(8).fill(0).map((_,i) =>
      `<div class="skel" style="margin:0 16px 10px;animation-delay:${i*80}ms"></div>`
    ).join('');
}

// ---- GLOBAL APP STORE - numeric IDs only ----
const APP_STORE = new Map();
let APP_COUNTER = 0;

function storeApp(app, repoMeta) {
  const id = APP_COUNTER++;
  APP_STORE.set(id, {app, repoMeta});
  return id;
}

function openStoredApp(id) {
  const entry = APP_STORE.get(Number(id));
  if (!entry) return;
  showAppSheet(entry.app, entry.repoMeta);
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Filter out markdown/github image syntax from screenshot arrays
function cleanShots(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.filter(s => typeof s === 'string' && s.startsWith('http') && !s.includes(']('));
}

function getBestDownloadURL(app) {
  // Try top-level downloadURL first
  if (app.downloadURL) return app.downloadURL;
  // Then first version with a downloadURL
  if (app.versions && app.versions.length) {
    for (const v of app.versions) { if (v.downloadURL) return v.downloadURL; }
  }
  return '';
}

function getVersions(app) {
  if (app.versions && app.versions.length) return app.versions;
  if (app.downloadURL) return [{
    version: app.version || app.absoluteVersion || '?',
    date: app.versionDate || app.date || '',
    downloadURL: app.downloadURL,
    localizedDescription: app.versionDescription || ''
  }];
  return [];
}

function getPerms(app) {
  const p = app.appPermissions?.privacy;
  if (!p) return [];
  // Array format: [{name, usageDescription}]
  if (Array.isArray(p)) return p.slice(0,5).map(x => x.name || '');
  // Object format: {NSCameraUsageDescription: "..."}
  return Object.keys(p).slice(0,5).map(k => k.replace(/^NS|UsageDescription$/g,'').replace(/([A-Z])/g,' $1').trim());
}

function showAppSheet(app, repoMeta) {
  const tint = app.tintColor ? '#' + app.tintColor.replace(/^#/,'') : 'var(--ac)';
  const icon = app.iconURL || '';
  const shots = cleanShots(app.screenshotURLs).slice(0,8);
  const versions = getVersions(app);
  const mainDL = getBestDownloadURL(app);
  const perms = getPerms(app);

  document.getElementById('sh-title').textContent = app.name||'App';

  let html = `
    <div class="app-hero">
      <div class="app-big-icon">${icon ? `<img src="${icon}" onerror="this.style.display='none'">` : ''}</div>
      <div class="app-hero-info">
        <div class="app-big-name">${esc(app.name||'')}</div>
        <div class="app-big-sub" style="color:${tint}">${esc(app.subtitle||'')}</div>
        <div class="app-big-dev">${esc(app.developerName||'')} &middot; ${esc(repoMeta.name||'')}</div>
      </div>
    </div>
    <div class="px">
      ${mainDL
        ? `<button class="dl-btn" id="main-dl-btn" onclick="dlApp('${esc(mainDL)}','${esc(app.name||'')}')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3v12m0 0-4-4m4 4 4-4M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/></svg>
            Download IPA
           </button>
           <button class="cp-btn" onclick="cpText('${esc(mainDL)}')">Copy IPA URL</button>`
        : `<div class="err-state" style="padding:12px 0">No download available for this app.</div>`
      }
    </div>`;

  if (shots.length) {
    html += `<div class="screenshots">${shots.map(s => `<img class="ss-img" src="${s}" loading="lazy" onerror="this.remove()" onclick="openLightbox('${s}')" style="cursor:pointer">`).join('')}</div>`;
  }

  html += `<div class="px">
    <div class="app-desc clamp" id="app-desc-txt">${esc(app.localizedDescription||'').replace(/\n/g,'<br>')}</div>
    <button class="read-more" onclick="toggleDesc()">More</button>
    <div class="ig">
      <div class="ir"><span class="il">Version</span><span class="iv">${esc(app.version||app.absoluteVersion||versions[0]?.version||'')}</span></div>
      <div class="ir"><span class="il">Category</span><span class="iv">${esc(app.category||repoMeta.category||'')}</span></div>
      <div class="ir"><span class="il">Source</span><span class="iv">${esc(repoMeta.name||'')}</span></div>
      ${(app.size||versions[0]?.size) ? `<div class="ir"><span class="il">Size</span><span class="iv">${((app.size||versions[0]?.size)/1024/1024).toFixed(1)} MB</span></div>` : ''}
    </div>
  </div>`;

  if (versions.length > 0) {
    html += `<div class="px"><div style="font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;padding:8px 0 6px">Version History</div>
    <div class="ig">${versions.map(v => {
      const vdl = v.downloadURL || '';
      const vnum = v.absoluteVersion || v.version || '?';
      return `<div class="ver-row" onclick="event.stopPropagation()">
        <div>
          <div class="ver-num">v${esc(vnum)}</div>
          <div class="ver-date">${v.date ? new Date(v.date).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : ''}</div>
        </div>
        ${vdl ? `<button class="ver-dl" onclick="dlApp('${esc(vdl)}','${esc(app.name||'')} v${esc(vnum)}')">GET</button>` : `<span style="font-size:12px;color:var(--mu)">N/A</span>`}
      </div>`;
    }).join('')}
    </div></div>`;
  }

  if (perms.filter(Boolean).length) {
    html += `<div class="px"><div class="ig">${perms.filter(Boolean).map(p => `<div class="ir"><span class="il" style="color:var(--mu);font-size:13px">${esc(p)}</span></div>`).join('')}</div></div>`;
  }

  html += '<div style="height:32px"></div>';

  document.getElementById('sh-body').innerHTML = html;
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('open');
  sheet.style.display = 'flex';
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
  descExpanded = false;
}

function toggleDesc() {
  const el = document.getElementById('app-desc-txt');
  const btn = el.nextElementSibling;
  if (!el) return;
  descExpanded = !descExpanded;
  el.classList.toggle('clamp', !descExpanded);
  btn.textContent = descExpanded ? 'Less' : 'More';
}

function openRepoDetail(id) {
  const repoMeta = REPOS_META.find(r => r.id === id);
  const rd = REPOS_DATA.find(r => r.meta.id === id);
  if (!repoMeta) return;

  const tint = '#0a84ff';
  document.getElementById('sh-title').textContent = repoMeta.name;

  let html = `<div style="padding:20px 16px 0">
    <button class="cp-btn" onclick="cpText('${esc(repoMeta.url)}')">Copy Source URL</button>
    <div class="app-desc">${esc(repoMeta.description||'')}</div>
    <div class="ig">
      <div class="ir"><span class="il">Maintainer</span><span class="iv">${esc(repoMeta.maintainer||'')}</span></div>
      <div class="ir"><span class="il">Category</span><span class="iv">${esc(repoMeta.category||'')}</span></div>
      <div class="ir"><span class="il">iOS Min</span><span class="iv">${repoMeta.ios_min||'?'}+</span></div>
      <div class="ir"><span class="il">Trust</span><span class="iv">${repoMeta.trust||'?'}/100</span></div>
      <div class="ir"><span class="il">Apps</span><span class="iv">${rd ? rd.apps.length : '...'}</span></div>
    </div>
  </div>`;

  if (rd && rd.apps.length) {
    html += `<div class="sec-hdr">Apps in this source</div>`;
    html += rd.apps.map((a, i) => {
      const id = storeApp(a, repoMeta);
      const icon = a.iconURL
        ? `<img src="${a.iconURL}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy">${fallbackIcon(a)}`
        : fallbackIcon(a);
      const dl = getBestDownloadURL(a);
      const delay = Math.min(i * 30, 400);
      return `<div class="app-row" style="animation-delay:${delay}ms" onclick="openStoredApp(${id})">
        <div class="ai">${icon}</div>
        <div class="ad">
          <div class="ad-name">${esc(a.name||'')}</div>
          <div class="ad-sub">${esc(a.subtitle || (a.localizedDescription ? a.localizedDescription.slice(0,55) : ''))}</div>
          <div class="ad-dev">${esc(a.developerName||'')}</div>
        </div>
        ${dl ? `<button class="get-btn" onclick="event.stopPropagation();dlApp('${esc(dl)}','${esc(a.name||'')}')">GET</button>` : `<span style="flex-shrink:0;font-size:12px;color:var(--mu)">N/A</span>`}
      </div>`;
    }).join('');
  } else if (rd && rd.failed) {
    html += `<div class="err-state">Could not load this source.<br><button class="cp-btn" style="margin-top:12px" onclick="retryRepo(${repoMeta.id})">Retry</button></div>`;
  } else if (!rd) {
    html += `<div class="empty-state" style="padding:30px"><div class="sp-ring" style="margin:0 auto 12px"></div>Loading source...</div>`;
    // Trigger a live fetch for this repo
    fetchJSON(repoMeta.url).then(data => {
      if (data && data.apps) {
        REPOS_DATA.push({meta: repoMeta, apps: data.apps, raw: data});
        ALL_APPS.push(...data.apps.map(a => ({...a, _repoName: repoMeta.name, _repoUrl: repoMeta.url, _repoMeta: repoMeta})));
      } else {
        REPOS_DATA.push({meta: repoMeta, apps: [], raw: null, failed: true});
      }
      // Refresh the open sheet if still on same repo
      const shTitle = document.getElementById('sh-title');
      if (shTitle && shTitle.textContent === repoMeta.name) openRepoDetail(repoMeta.id);
    });
  }

  html += '<div style="height:32px"></div>';
  document.getElementById('sh-body').innerHTML = html;
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('open');
  sheet.style.display = 'flex';
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
}

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lb-img');
  img.style.opacity = '0';
  img.style.transform = 'scale(.86)';
  img.src = src;
  lb.style.display = 'flex';
  // Double rAF ensures transition fires after display:flex takes effect
  requestAnimationFrame(() => requestAnimationFrame(() => {
    img.style.transition = 'opacity .3s ease, transform .38s cubic-bezier(.34,1.2,.64,1)';
    img.style.opacity = '1';
    img.style.transform = 'scale(1)';
  }));
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lb-img');
  img.style.opacity = '0';
  img.style.transform = 'scale(.86)';
  setTimeout(() => { lb.style.display = 'none'; img.src = ''; img.style.transition = ''; }, 320);
}

function retryRepo(id) {
  const repoMeta = REPOS_META.find(r => r.id === id);
  if (!repoMeta) return;
  // Remove failed entry
  const idx = REPOS_DATA.findIndex(r => r.meta.id === id);
  if (idx !== -1) REPOS_DATA.splice(idx, 1);
  openRepoDetail(id);
}

// ---- DOWNLOAD ----
function dlApp(url, name) {
  if (!url) { toast('No download URL'); return; }
  // On iOS Safari / standalone: open the .ipa link directly
  // iOS will offer to open with AltStore/SideStore via the share sheet
  window.location.href = url;
  toast('Opening ' + (name||'app') + '...');
}

// ---- CLOSE SHEET ----
function closeSheet() {
  const s = document.getElementById('sheet');
  s.classList.remove('open');
  setTimeout(() => { s.style.display = 'none'; }, 360);
}

// swipe down to close
let sy = 0;
document.getElementById('sheet').addEventListener('touchstart', e => { sy = e.touches[0].clientY; }, {passive:true});
document.getElementById('sheet').addEventListener('touchend', e => { if (e.changedTouches[0].clientY - sy > 80) closeSheet(); }, {passive:true});

// ---- CHIPS ----
function buildChips(cats) {
  const el = document.getElementById('chips');
  el.innerHTML = `<div class="chip on" data-c="all" onclick="setChip(this,'all')">All</div>` +
    cats.filter(c => c.id !== 'all').map(c =>
      `<div class="chip" data-c="${c.id}" onclick="setChip(this,'${c.id}')">${c.label}</div>`
    ).join('');
}

function setChip(el, cat) {
  activeCategory = cat;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.c === cat));
  render();
}

// ---- TABS ----
function switchTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('si').value = '';
  searchQuery = '';
  document.getElementById('cb').classList.remove('on');
  document.getElementById('scroll-area').scrollTop = 0;
  render();
}

// ---- SEARCH ----
document.getElementById('si').addEventListener('input', function() {
  searchQuery = this.value.trim();
  document.getElementById('cb').classList.toggle('on', !!searchQuery);
  render();
});
function clrS() {
  document.getElementById('si').value = '';
  searchQuery = '';
  document.getElementById('cb').classList.remove('on');
  render();
}

// ---- HELPERS ----
function cpText(t) {
  navigator.clipboard.writeText(t).then(() => toast('Copied'));
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2000);
}
function showError(msg) {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('app').style.opacity = '1';
  document.getElementById('main-content').innerHTML = `<div class="err-state">${msg}</div>`;
}

init();
</script>
